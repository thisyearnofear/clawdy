<!doctype html>
<meta charset="utf-8">
<title>chassis trio</title>
<style>
  html,body{margin:0;background:#e8e4d8}
  canvas{display:block}
</style>
<canvas id="c" width="1200" height="520"></canvas>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
renderer.setSize(1200, 520, false)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xe8e4d8)

const camera = new THREE.PerspectiveCamera(38, 1200 / 520, 0.1, 100)
camera.position.set(0, 3.4, 9.5)
camera.lookAt(0, 0.4, 0)

scene.add(new THREE.HemisphereLight(0xfff6e6, 0x8a7a5c, 1.15))
const sun = new THREE.DirectionalLight(0xffe8c4, 1.6)
sun.position.set(4, 7, 5)
scene.add(sun)

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0xd8cdb4, roughness: 1 })
)
ground.rotation.x = -Math.PI / 2
scene.add(ground)

const loader = new GLTFLoader()
const files = ['chassis-scout', 'chassis-hauler', 'chassis-raider']
const xs = [-3.4, 0, 3.4]
let pending = files.length

for (let i = 0; i < files.length; i++) {
  loader.load(`/public/assets/tripo/${files[i]}.glb`, gltf => {
    const root = gltf.scene
    const box = new THREE.Box3().setFromObject(root)
    const size = box.getSize(new THREE.Vector3())
    const scale = 2.6 / Math.max(size.x, size.y, size.z)
    root.scale.setScalar(scale)
    const box2 = new THREE.Box3().setFromObject(root)
    root.position.set(xs[i] - (box2.min.x + box2.max.x) / 2, -box2.min.y, -(box2.min.z + box2.max.z) / 2)
    // Same +Z forward the sim uses; the game applies -PI/2 Y on top.
    root.rotation.y = -Math.PI / 2
    scene.add(root)
    if (--pending === 0) { window.__trioReady = true; renderer.render(scene, camera) }
  })
}

renderer.setAnimationLoop(() => renderer.render(scene, camera))
</script>
