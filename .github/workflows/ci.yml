name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Eval gate
        run: npm run eval:gate

      # No Convex secret in CI: generated api bindings are committed, sync
      # tests run against in-memory convex-test, and the build's offline path
      # (NEXT_PUBLIC_CONVEX_URL unset) is exactly what ships as the static export.
      - name: Build
        run: npm run build
